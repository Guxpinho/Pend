<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Produto</h1>
    <form id="form-cadastro">
        <label for="nome">Digite o nome do produto:</label><br>
        <input id="nome" type="text" placeholder="Digite o nome do produto"><br><br>

        <label for="preco">Digite o preço do produto:</label><br>
        <input id="preco" type="number" placeholder="Digite o preço do produto"><br><br>

        <label for="categoria">Digite a categoria do produto:</label><br>
        <input id="categoria" type="text" placeholder="Digite a categoria do produto"><br><br>

        <label for="desconto">Digite o desconto do produto:</label><br>
        <input id="desconto" type="number" placeholder="Digite o desconto do produto"><br><br>


        <button id="btn">Cadastrar</button>

        <div id="resultado"></div>

    </form>
    <script src="script-cadastro.js"></script>
</body>
</html>
